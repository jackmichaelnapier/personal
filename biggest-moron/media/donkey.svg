<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-label="Punk donkey mascot">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <!-- Ears (back layer) -->
  <path d="M 70 38 Q 60 8 82 18 Q 88 38 95 52 Z"
        fill="#1a1a1a" stroke="#0a0a0a" stroke-width="3"/>
  <path d="M 170 38 Q 180 8 158 18 Q 152 38 145 52 Z"
        fill="#1a1a1a" stroke="#0a0a0a" stroke-width="3"/>
  <path d="M 75 26 Q 76 38 88 50" stroke="#fcd800" stroke-width="2.5" fill="none"/>
  <path d="M 165 26 Q 164 38 152 50" stroke="#fcd800" stroke-width="2.5" fill="none"/>

  <!-- Head (long donkey muzzle silhouette) -->
  <path d="M 70 75
           Q 56 110 62 150
           Q 70 190 120 205
           Q 175 200 180 165
           Q 188 120 172 85
           Q 148 60 120 58
           Q 88 60 70 75 Z"
        fill="#3a3a3a" stroke="#0a0a0a" stroke-width="4"/>

  <!-- Mohawk forelock between ears -->
  <path d="M 100 62 L 104 38 L 110 60 L 116 36 L 122 60 L 128 38 L 134 60 L 140 62"
        fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>

  <!-- Muzzle (lighter patch) -->
  <ellipse cx="120" cy="178" rx="38" ry="24" fill="#bdb59f" stroke="#0a0a0a" stroke-width="3"/>

  <!-- Nostrils -->
  <ellipse cx="106" cy="180" rx="4" ry="6" fill="#0a0a0a"/>
  <ellipse cx="134" cy="180" rx="4" ry="6" fill="#0a0a0a"/>

  <!-- Dead X eyes -->
  <g stroke="#0a0a0a" stroke-width="6" stroke-linecap="round">
    <line x1="84" y1="110" x2="102" y2="128"/>
    <line x1="102" y1="110" x2="84" y2="128"/>
    <line x1="138" y1="110" x2="156" y2="128"/>
    <line x1="156" y1="110" x2="138" y2="128"/>
  </g>

  <!-- Mouth -->
  <path d="M 104 196 Q 120 202 136 196"
        fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>

  <!-- Tongue lolling -->
  <path d="M 120 200 Q 124 218 116 224 Q 110 218 114 206 Z"
        fill="#d40000" stroke="#0a0a0a" stroke-width="2.5"/>

  <!-- Bandage X across cheek -->
  <g stroke="#d40000" stroke-width="4" stroke-linecap="round">
    <line x1="62" y1="148" x2="80" y2="166"/>
    <line x1="80" y1="148" x2="62" y2="166"/>
  </g>

  <!-- Star pin on other cheek -->
  <g transform="translate(178 152) rotate(8)">
    <path d="M 0 -12 L 3.5 -3.7 L 12 -3.7 L 5.2 1.4 L 7.8 9.7 L 0 4.8 L -7.8 9.7 L -5.2 1.4 L -12 -3.7 L -3.5 -3.7 Z"
          fill="#fcd800" stroke="#0a0a0a" stroke-width="2.5"/>
  </g>
</svg>
